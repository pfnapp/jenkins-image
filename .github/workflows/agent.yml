name: Jenkins Agent
on:
  workflow_dispatch:
    inputs:
      jenkins_url:
        description: 'Jenkins server URL'
        required: true
      agent_name:
        description: 'Jenkins agent name'
        required: true
      agent_secret:
        description: 'Jenkins agent secret'
        required: true

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        
      - name: Mask secret
        run: |
          secret=$(jq -r '.inputs.agent_secret' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$secret"
          echo "::add-mask::${{ inputs.jenkins_url }}"
          echo "::add-mask::jnlp-jenkins-deploy.pfnapp.dev:10550"

      - name: Download Jenkins agent JAR
        run: |
          curl -sSfL --retry 3 --retry-delay 5 -o agent.jar "${{ inputs.jenkins_url }}jnlpJars/agent.jar"
          
      - name: Verify Jenkins connectivity
        run: |
          curl -sSfL --max-time 10 "${{ inputs.jenkins_url }}" || \
            (echo "Jenkins server unreachable"; exit 1)
            
      - name: Connect to Jenkins
        timeout-minutes: 120
        env:
          AGENT_SECRET: ${{ inputs.agent_secret }}
        run: |
          for attempt in {1..3}; do
            echo "Connection attempt $attempt..."
            "$JAVA_HOME_21_X64/bin/java" -jar agent.jar \
              -url "${{ inputs.jenkins_url }}" \
              -tunnel "jnlp-jenkins-deploy.pfnapp.dev:10550" \
              -secret "$AGENT_SECRET" && break
            if [ $attempt -lt 3 ]; then sleep 30; fi
          done
